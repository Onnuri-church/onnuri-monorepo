name: Jira Sync

on:
  pull_request:
    types: [closed]

jobs:
  sync-jira:
    # 머지된 PR만 처리한다. 'skip-jira-sync' 라벨이 붙은 PR(예: dev -> main 릴리스 PR)은 건너뛴다 —
    # 릴리스 PR에는 수백 개 커밋의 티켓키가 한꺼번에 잡혀서, 티켓별로 채워 둔 Description이
    # 릴리스 본문으로 전부 덮어써지고 일괄 완료 처리되기 때문이다.
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-jira-sync')
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_COMMITS_FILE: /tmp/pr-commit-subjects.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect PR commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --pretty=%s "$BASE_SHA".."$HEAD_SHA" > "$PR_COMMITS_FILE"

      - name: Update Jira issue description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/jira/update-description.js

      # Description을 먼저 채운 뒤 완료 처리한다 — 순서가 반대면 티켓이 잠깐
      # "내용 없는 완료" 상태로 보인다.
      - name: Transition Jira issues to done
        run: node scripts/jira/transition-issues.js
